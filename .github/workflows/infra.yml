name: Infra CI

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  infra:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Format
        run: terraform fmt -check -recursive

      # No backend, so CI needs no AWS credentials and never reads the real state.
      - name: Install providers
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test

      # The same Caddy version user-data.sh installs on the server. fmt fails
      # when the file isn't in Caddy's standard format.
      - name: Check the Caddyfile
        run: |
          docker run --rm -e DOMAIN=scheduler.example.org -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9 sh -c 'caddy fmt --diff /etc/caddy/Caddyfile && caddy validate --config /etc/caddy/Caddyfile'
